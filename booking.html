<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Slot - Smart Parking</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="profile.html">Profile</a>
        <button id="logoutBtn" class="btn" style="float:right;">Logout</button>
      </nav>
    </header>

    <div class="container fade-in">
      <h2>Book a Parking Slot</h2>
      <form id="bookingForm">
        <label for="slotNumber">Select Slot</label>
        <select id="slotNumber" required>
          <option value="">Choose...</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>

        <label for="bookDate">Date</label>
        <input type="date" id="bookDate" required />

        <label for="bookTime">Time</label>
        <input type="time" id="bookTime" required />

        <button type="submit">Proceed & Pay ($10)</button>
      </form>
    </div>

    <script src="assets/script.js"></script>
  </body>
</html>
