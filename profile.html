<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Smart Parking</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="booking.html">Book Slot</a>
        <button id="logoutBtn" class="btn" style="float:right;">Logout</button>
      </nav>
    </header>

    <div class="container fade-in" id="profileSection">
      <h2>Your Profile</h2>
      <p><strong>Name:</strong> <span id="profileName"></span></p>
      <p><strong>Email:</strong> <span id="profileEmail"></span></p>
      <p style="margin-top:1rem;">
        <a href="booking.html" class="btn">Book a Parking Slot</a>
      </p>

      <h3 style="margin-top:2rem;">Your Bookings</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Slot</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userBookingsBody"></tbody>
      </table>
    </div>

    <script src="assets/script.js"></script>
  </body>
</html>
